name: Validate code and synthetic tests

on:
  push:
    paths:
      - 'audit/**'
      - 'supplementary/**'
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/validate-code.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Compile every Python script
        run: python -m compileall -q src audit supplementary tests
      - name: Run synthetic tests
        run: python -m unittest discover -s tests -v
      - name: Check published numerical tables
        run: python src/verify_paper.py --results results

name: Generate and commit research figures

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/render_figures.py'
      - 'src/analyze.py'
      - 'results/annual_hhi.csv'
      - 'results/industry_year_hhi.csv'
      - '.github/workflows/generate-figures.yml'

permissions:
  contents: write

jobs:
  regenerate-figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Recreate all three figures
        run: python src/render_figures.py
      - name: Commit generated PNG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/figure1_annual_geo_industry_hhi.png figures/figure2_geo_vs_industry_hhi.png figures/figure3_annual_joint_hhi.png
          if ! git diff --cached --quiet; then
            git commit -m "Add reproducible concentration figures"
            git push
          fi
